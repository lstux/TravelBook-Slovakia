# Construit le carnet (moteur + données) et le publie sur GitHub Pages.
# Prérequis : Settings > Pages > Source = "GitHub Actions".
name: Déployer sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Données
        uses: actions/checkout@v4
        with:
          path: data

      - name: Moteur
        uses: actions/checkout@v4
        with:
          repository: lstux/TravelBook
          ref: main
          path: engine

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Construire le site
        run: python3 engine/publish.py --data data --export site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
